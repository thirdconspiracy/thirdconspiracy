<button class="btn btn-small btn-primary"
        [attr.aria-label]="'Clear Votes'"
        (click)="onDealClick()">
  Clear Votes
</button>
<button class="btn btn-small btn-primary"
        [attr.aria-label]="table?.show ? 'Hide Votes' : 'Show Votes'"
        (click)="onShowToggle()">
  {{ table?.show ? 'Hide Votes' : 'Show Votes' }}
</button>
<button class="btn btn-small btn-primary"
        [attr.aria-label]="currentPlayer?.isPlaying ? 'Become Observer' : 'Become Player'"
        (click)="onIsPlayingToggle()">
  {{ currentPlayer?.isPlaying ? 'Become Observer' : 'Become Player' }}
</button>
