<div class="focus-player">
  <button
    type="button"
    class="play btn-soft btn-soft-primary btn-round"
    [disabled]="!current()"
    [attr.aria-label]="(playing() ? 'Pause ' : 'Play ') + name()"
    [attr.aria-pressed]="playing()"
    (click)="playToggle.emit()"
  >
    @if (playing()) {
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z" />
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 5v14l11-7z" />
      </svg>
    }
  </button>

  <div class="summary">
    <span class="current" [class.empty]="!current()">{{ current()?.label ?? emptyText() }}</span>
    @if (options().length) {
      <button
        type="button"
        class="icon toggle btn-ghost"
        [attr.aria-label]="name() + ' options'"
        [attr.aria-expanded]="expanded()"
        [attr.aria-controls]="panelId"
        [title]="expanded() ? 'Hide options' : 'Show options'"
        (click)="expanded.set(!expanded())"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M16.59 8.59 12 13.17 7.41 8.59 6 10l6 6 6-6z" />
        </svg>
      </button>
    }
  </div>

  <div class="volume">
    <button
      type="button"
      class="icon mute btn-ghost"
      [attr.aria-label]="(muted() ? 'Unmute ' : 'Mute ') + name()"
      [attr.aria-pressed]="muted()"
      (click)="muteToggle.emit()"
    >
      @if (muted() || volume() === 0) {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"
          />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"
          />
        </svg>
      }
    </button>
    <input
      type="range"
      min="0"
      max="1"
      step="0.01"
      [value]="volume()"
      [attr.aria-label]="name() + ' volume'"
      (input)="onVolume($event)"
    />
    @if (current() && repeat(); as mode) {
      <button
        type="button"
        class="icon repeat btn-ghost"
        [attr.aria-label]="mode === 'one' ? 'Repeat: current song' : 'Repeat: all songs'"
        [title]="mode === 'one' ? 'Repeating current song' : 'Repeating all songs'"
        (click)="repeatToggle.emit()"
      >
        @if (mode === 'one') {
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z" />
          </svg>
        }
      </button>
    }
  </div>

  <div class="panel" [id]="panelId" [hidden]="!panelOpen()">
    @if (options().length) {
      <div class="option list-navigation" role="radiogroup" [attr.aria-label]="name()">
        @for (option of options(); track option.value) {
          <div class="option list-navigation-item" [class.active]="option.value === selected()">
            <label>
              <input
                type="radio"
                [name]="'focus-' + name()"
                [checked]="option.value === selected()"
                (change)="optionSelect.emit(option.value)"
              />
              <span>{{ option.label }}</span>
            </label>
            @if (removable()) {
              <button
                type="button"
                class="icon remove btn-ghost"
                title="Remove"
                [attr.aria-label]="'Remove ' + option.label"
                (click)="optionRemove.emit(option)"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM8 9h8v10H8V9zm7.5-5-1-1h-5l-1 1H5v2h14V4z" />
                </svg>
              </button>
            }
          </div>
        }
      </div>
    }
    @if (addLabel(); as label) {
      <button type="button" class="add btn-ghost" (click)="expanded.set(true); add.emit()">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
        </svg>
        <span>{{ label }}</span>
      </button>
    }
  </div>

  @if (error(); as message) {
    <p class="alert-danger" role="alert">{{ message }}</p>
  }
</div>
